name: Android FGS demo video
on:
  workflow_dispatch:
    inputs:
      script:
        description: Script in scripts/fgs_video to run
        default: discover.sh
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download the app build
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download fgs-apk -p henseiki.apk -R "$GITHUB_REPOSITORY"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          ram-size: 8192M
          cores: 4
          heap-size: 1024M
          disable-animations: true
          script: bash scripts/fgs_video/${{ inputs.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgs-output
          path: /tmp/fgs
