name: Android FGS demo video
on:
  workflow_dispatch:
    inputs:
      script:
        description: Script in scripts/fgs_video to run
        default: discover.sh
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download the app build
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download fgs-apk -p henseiki.apk -R "$GITHUB_REPOSITORY"
      - name: Prepare a sample voice file (synthetic speech, not a real person)
        timeout-minutes: 8
        run: |
          pip install --quiet gTTS
          python3 -c "from gtts import gTTS; gTTS('こんにちは。これは、私の声をもとにスマートフォンの中だけで作った音声です。今日はとても良い天気で、散歩に出かけました。公園では子どもたちが楽しそうに遊んでいて、私も少し休むことにしました。', lang='ja').save('/tmp/sample.mp3')"
          ffmpeg -y -loglevel error -i /tmp/sample.mp3 -ar 44100 -ac 1 /tmp/sample44.wav
          ls -la /tmp/sample44.wav
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          ram-size: 6144M
          disable-animations: true
          script: bash scripts/fgs_video/${{ inputs.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgs-output
          path: /tmp/fgs
