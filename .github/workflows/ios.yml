name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "android/app/src/main/java/com/voiceclone/app/LegalTexts.kt"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    # The Swift core is plain Swift, so it is built and tested on Linux (cheap).
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Legal text is in sync with Android
        run: |
          apt-get update -q && apt-get install -y -q python3
          python3 ios/scripts/generate_legal.py --check
      - name: Swift tests
        run: swift test --package-path ios

  app:
    # Needs Xcode: builds the app unsigned and packages an .ipa that can be signed later (AltStore, Sideloadly, Xcode).
    runs-on: macos-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project VoiceClone.xcodeproj -scheme VoiceClone -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the unsigned .ipa
        run: |
          cd ios
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/VoiceClone.app Payload/
          zip -qry VoiceClone-unsigned.ipa Payload
          shasum -a 256 VoiceClone-unsigned.ipa | tee VoiceClone-unsigned.ipa.sha256
      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" ios/VoiceClone-unsigned.ipa ios/VoiceClone-unsigned.ipa.sha256 \
            --prerelease --title "VoiceClone iOS build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} (unsigned)" \
            --notes "Unsigned iOS build of ${GITHUB_SHA}. Sign it with your own Apple ID (Xcode, AltStore, Sideloadly) to install."
